<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Browser Kingdom</title>

  <!-- Icono de la pestaña del navegador y al guardar la web (encabezado.png) -->
  <link rel="icon" type="image/png" href="encabezado.png">
  <link rel="shortcut icon" type="image/png" href="encabezado.png">
  <link rel="apple-touch-icon" href="encabezado.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* ---------- ESTILO BASICO ---------- */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #262626;
      color: #ffffff;
      font-family: "Press Start 2P", monospace;
      font-size: 12px;
      line-height: 1.8;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 10px;
      color: #ffd23f;
    }

    h2 {
      font-size: 12px;
      margin: 0 0 15px;
      color: #4da6ff;
    }

    h3 {
      font-size: 12px;
      margin: 0 0 12px;
      color: #ffd23f;
    }

    p {
      margin: 0 0 10px;
      color: #cccccc;
    }

    label {
      color: #5fd35f;
    }

    select, input, button {
      font-family: inherit;
      font-size: 12px;
      color: #ffffff;
      background: #262626;
      border: 2px solid #ffffff;
      padding: 8px;
    }

    input {
      width: 100%;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
    }

    /* Imagenes nitidas: al agrandar un PNG pequeño no se difumina,
       se ven los pixeles definidos */
    img {
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    /* ---------- PANTALLA DE CARGA ---------- */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #262626;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Cuando termina de cargar, se oculta suavemente */
    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #loading img {
      max-width: 40vw;
      max-height: 40vh;
      width: auto;
      height: auto;
    }

    /* Texto de respaldo por si no se encuentra loading.gif */
    #loadingText {
      display: none;
      color: #ffd23f;
    }

    /* ---------- INTRO: LOGO SOBRE LA WEB DIFUMINADA ---------- */
    #intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(38, 38, 38, 0.35);
      transition: opacity 0.8s ease;
    }

    #intro img {
      /* Tamaño fijo para que cualquier logo se vea grande y nitido */
      width: min(50vw, 300px);
      height: auto;
      max-height: 50vh;
      object-fit: contain;
      transition: transform 0.8s ease, opacity 0.8s ease;
    }

    /* Animacion de salida: el logo crece y se desvanece */
    #intro.leave {
      opacity: 0;
    }

    #intro.leave img {
      transform: scale(1.8);
      opacity: 0;
    }

    /* La web empieza difuminada y se va enfocando poco a poco */
    #site {
      filter: blur(0);
      transition: filter 0.8s ease;
    }

    #site.blurred {
      filter: blur(8px);
    }

    /* ---------- BARRA DE NAVEGACION ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #1a1a1a;
      border-bottom: 3px solid #ffd23f;
    }

    .nav__item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: transparent;
      border: 2px solid transparent;
      color: #cccccc;
      font-size: 10px;
    }

    .nav__item:hover {
      background: #333333;
      color: #ffffff;
    }

    .nav__item.active {
      border-color: #ffd23f;
      color: #ffd23f;
    }

    .nav__brand {
      color: #ffd23f;
      border-color: transparent;
    }

    .nav__spacer {
      flex: 1;
    }

    .nav__icon {
      font-size: 16px;
    }

    .nav__icon img {
      display: block;
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* ---------- PANTALLAS ---------- */
    /* Solo se ve la pantalla que tenga la clase "visible" */
    .screen {
      display: none;
    }

    .screen.visible {
      display: block;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      transition: opacity 0.3s ease, filter 0.3s ease, transform 0.3s ease;
    }

    /* Al cambiar de opcion: el contenido se difumina, se desvanece y baja un poco.
       Al quitar esta clase, la nueva pantalla entra enfocandose y subiendo. */
    main.switching {
      opacity: 0;
      filter: blur(10px);
      transform: translateY(12px) scale(0.98);
    }

    /* Si el usuario prefiere menos movimiento, no hay animacion */
    @media (prefers-reduced-motion: reduce) {
      main {
        transition: none;
      }
    }

    /* ---------- CABECERA (HOME) ---------- */
    header {
      border: 3px solid #ffd23f;
      background: linear-gradient(135deg, #3a2a10 0%, #1a1a1a 60%, #10253a 100%);
      padding: 25px;
      margin-bottom: 25px;
    }

    .header__container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
    }

    .header__main {
      flex: 1 1 280px;
    }

    .header__side {
      flex: 1 1 280px;
    }

    .header__subtitle {
      color: #cccccc;
      margin-bottom: 20px;
    }

    /* Botones grandes del menu */
    .header__menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 8px;
      font-size: 11px;
      background: #1a1a1a;
      text-align: center;
    }

    .menu-button .icon {
      font-size: 28px;
    }

    .menu-button .icon img {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    #menuCalc { color: #4da6ff; border-color: #4da6ff; }  /* Calculator = azul */
    #menuMap  { color: #5fd35f; border-color: #5fd35f; }  /* Game Map = verde */
    #menuCredits { color: #ffb347; border-color: #ffb347; grid-column: 1 / -1; }  /* Credits = naranja */

    .menu-button:hover {
      background: #333333;
    }

    .lang-row {
      margin-bottom: 15px;
    }

    /* ---------- SECCIONES (HOME) ---------- */
    .article {
      display: block;
    }

    /* Caja que agrupa cada parte */
    .box {
      border: 2px solid #ffffff;
      background: #2e2e2e;
      padding: 15px;
      margin-bottom: 20px;
    }

    .article .box {
      margin-bottom: 0;
    }

    /* ---------- FLECHA PARA VOLVER ---------- */
    .back {
      margin-bottom: 20px;
      color: #ffd23f;
      border-color: #ffd23f;
    }

    /* ---------- CALCULADORA ---------- */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .tabs button {
      flex: 1 1 auto;
    }

    /* Colores de cada pestaña */
    #tab1 { color: #4da6ff; border-color: #4da6ff; }  /* Level = azul */
    #tab2 { color: #5fd35f; border-color: #5fd35f; }  /* Skill = verde */
    #tab3 { color: #ffb347; border-color: #ffb347; }  /* XP → Level = naranja */

    /* Pestaña activa: se rellena con su color */
    #tab1.active { background: #4da6ff; color: #262626; }
    #tab2.active { background: #5fd35f; color: #262626; }
    #tab3.active { background: #ffb347; color: #262626; }

    /* Cada linea de resultado */
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #555555;
    }

    /* Nombre de cada resultado en gris claro y el valor en amarillo */
    .row span:first-child {
      color: #cccccc;
    }

    .row span:last-child {
      color: #ffd23f;
      text-align: right;
    }

    .error {
      color: #ff6666;
      margin-top: 10px;
    }

    /* ---------- GAME MAP ---------- */
    .soon {
      text-align: center;
      color: #5fd35f;
      font-size: 16px;
      padding: 30px 0;
    }

    /* ---------- CREDITOS ---------- */
    .credit-role {
      color: #cccccc;
      margin: 0 0 8px;
    }

    .credit-name {
      color: #ffd23f;
      font-size: 1.4em;
      margin: 0;
    }

    /* ---------- ANIMACIONES Y EFECTOS AL PASAR EL CURSOR ---------- */

    /* Suavizar los cambios de todos los controles */
    button, select, input {
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease,
                  transform 0.2s ease, box-shadow 0.25s ease;
    }

    /* Al pulsar, el boton se hunde un poco */
    button:active {
      transform: scale(0.95);
    }

    /* Campo de texto: brilla al seleccionarlo */
    input:focus,
    select:focus {
      outline: none;
      border-color: #ffd23f;
      box-shadow: 0 0 12px rgba(255, 210, 63, 0.45);
    }

    /* Los iconos (barra y menu) se mueven suavemente */
    .nav__icon img,
    .menu-button .icon img {
      transition: transform 0.25s ease;
    }

    /* Barra de navegacion: linea que crece bajo el boton */
    .nav__item {
      position: relative;
    }

    .nav__item::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 0;
      height: 3px;
      background: #ffd23f;
      transition: width 0.25s ease, left 0.25s ease;
    }

    /* Entrada de cada pantalla: los bloques suben uno tras otro */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .screen.visible > * {
      animation: rise 0.5s ease both;
    }

    .screen.visible > *:nth-child(2) { animation-delay: 0.08s; }
    .screen.visible > *:nth-child(3) { animation-delay: 0.16s; }
    .screen.visible > *:nth-child(4) { animation-delay: 0.24s; }
    .screen.visible > *:nth-child(5) { animation-delay: 0.32s; }

    /* Solo en dispositivos con raton (en el movil el "hover" se quedaria pegado) */
    @media (hover: hover) {
      /* Botones del menu principal: suben, brillan y el icono se agranda */
      .menu-button:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 18px -4px currentColor;
      }

      .menu-button:hover .icon img {
        transform: scale(1.18) rotate(-4deg);
      }

      /* Barra de navegacion */
      .nav__item:hover .nav__icon img {
        transform: scale(1.2);
      }

      .nav__item:hover::after {
        width: 70%;
        left: 15%;
      }

      /* Pestañas de la calculadora */
      .tabs button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px -4px currentColor;
      }

      /* Flecha de volver: se desliza hacia la izquierda */
      .back:hover {
        transform: translateX(-5px);
        box-shadow: 0 0 10px rgba(255, 210, 63, 0.4);
      }

      /* Selector de idioma */
      select:hover {
        border-color: #ffd23f;
      }

      /* Cajas: el borde se ilumina */
      .box:hover {
        border-color: #ffd23f;
      }

      /* Lineas de resultado: se resaltan y se desplazan un poco */
      .row:hover {
        background: rgba(255, 255, 255, 0.06);
        transform: translateX(4px);
      }
    }

    .box,
    .row {
      transition: border-color 0.25s ease, background 0.2s ease, transform 0.2s ease;
    }

    /* ----- MAS ANIMACIONES ----- */

    /* Titulo principal: brillo que respira */
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 0 rgba(255, 210, 63, 0); }
      50%      { text-shadow: 0 0 14px rgba(255, 210, 63, 0.65); }
    }

    h1 {
      animation: glow 3.5s ease-in-out infinite;
    }

    /* Cabecera: el degradado se mueve despacio */
    @keyframes drift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background-size: 220% 220%;
    }

    /* La cabecera combina la entrada (rise) con el degradado en movimiento */
    .screen.visible > header {
      animation: rise 0.5s ease both, drift 14s ease-in-out infinite;
    }

    /* Barra de navegacion: baja desde arriba al cargar */
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    nav {
      animation: slideDown 0.6s ease both;
    }

    /* Opcion abierta en la barra: borde que late */
    @keyframes pulseBorder {
      0%, 100% { box-shadow: 0 0 0 rgba(255, 210, 63, 0); }
      50%      { box-shadow: 0 0 10px rgba(255, 210, 63, 0.5); }
    }

    .nav__item.active {
      animation: pulseBorder 2.4s ease-in-out infinite;
    }

    /* Iconos del menu: flotan suavemente (cada uno a su ritmo) */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    .menu-button .icon {
      display: block;
      animation: bob 3s ease-in-out infinite;
    }

    .header__menu .menu-button:nth-child(2) .icon { animation-delay: -1s; }
    .header__menu .menu-button:nth-child(3) .icon { animation-delay: -2s; }

    /* Resultados: aparecen en cascada al cambiar de pestaña */
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-14px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    #results.animate .row {
      animation: rowIn 0.4s ease both;
    }

    #results.animate .row:nth-child(2) { animation-delay: 0.05s; }
    #results.animate .row:nth-child(3) { animation-delay: 0.10s; }
    #results.animate .row:nth-child(4) { animation-delay: 0.15s; }
    #results.animate .row:nth-child(5) { animation-delay: 0.20s; }
    #results.animate .row:nth-child(6) { animation-delay: 0.25s; }
    #results.animate .row:nth-child(7) { animation-delay: 0.30s; }
    #results.animate .row:nth-child(8) { animation-delay: 0.35s; }

    /* Mensaje de error: pequeña sacudida */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .error:not(:empty) {
      animation: shake 0.4s ease;
    }

    /* "Soon..." parpadea suavemente */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    .soon {
      animation: blink 1.8s ease-in-out infinite;
    }

    /* Onda al hacer clic en un boton */
    .menu-button,
    .tabs button,
    .back {
      position: relative;
      overflow: hidden;
    }

    @keyframes ripple {
      from { transform: scale(0); opacity: 0.45; }
      to   { transform: scale(1); opacity: 0; }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      pointer-events: none;
      animation: ripple 0.6s ease-out forwards;
    }

    /* Particulas de fondo: cuadrados que suben despacio */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    @keyframes floatUp {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.35; }
      85%  { opacity: 0.35; }
      to   { transform: translateY(-110vh) rotate(180deg); opacity: 0; }
    }

    #particles span {
      position: absolute;
      bottom: -20px;
      background: #ffd23f;
      animation: floatUp linear infinite;
    }

    /* Si el dispositivo pide menos movimiento, se desactivan las animaciones */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ---------- PIE DE PAGINA ---------- */
    footer {
      text-align: center;
      font-size: 8px;
      color: #888888;
      padding: 20px;
      border-top: 2px solid #3a3a3a;
      margin-top: 20px;
    }

    /* ---------- ADAPTACION A MOVIL ---------- */
    @media (max-width: 600px) {
      /* En movil la barra solo muestra los iconos */
      .nav__text {
        display: none;
      }

      .nav__item {
        padding: 10px;
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 10px;
      }

      main {
        padding: 12px;
      }

      h1 { font-size: 14px; }
      h2, h3 { font-size: 10px; }

      select, input, button {
        font-size: 10px;
      }

      header {
        padding: 15px;
      }

      .menu-button {
        font-size: 9px;
      }

      .box {
        padding: 10px;
      }

      /* En movil, las pestañas ocupan una linea cada una */
      .tabs button {
        flex: 1 1 100%;
      }

      /* En movil, cada resultado se apila: nombre arriba, valor debajo */
      .row {
        flex-direction: column;
        gap: 2px;
      }

      .row span:last-child {
        text-align: left;
      }
    }

    /* ---------- ADAPTACION A TABLET Y PC ---------- */
    @media (min-width: 768px) {
      body {
        font-size: 13px;
      }

      main {
        padding: 30px;
      }

      h1 { font-size: 24px; }
      h2, h3 { font-size: 14px; }

      select, input, button {
        font-size: 13px;
      }

      .nav__item {
        font-size: 12px;
      }

      .menu-button {
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <!-- Particulas decorativas de fondo (se crean con JavaScript) -->
  <div id="particles"></div>

  <!-- ========== PANTALLA DE CARGA ========== -->
  <div id="loading">
    <!-- loading.gif debe estar en la misma carpeta que este archivo (index.html) -->
    <img id="loadingImg" src="loading.gif" alt="Loading" onerror="this.style.display='none'; document.getElementById('loadingText').style.display='block';">
    <div id="loadingText">Loading...</div>
  </div>

  <!-- ========== INTRO: LOGO SOBRE LA WEB DIFUMINADA ========== -->
  <div id="intro">
    <img id="introLogo" src="logo.png" alt="" onerror="this.style.display='none';">
  </div>

  <!-- Todo el contenido de la web va dentro de #site (empieza difuminado) -->
  <div id="site" class="blurred">

  <!-- ========== BARRA DE NAVEGACION ========== -->
  <nav>
    <button class="nav__item nav__brand" id="navHome" title="Home">
      <span class="nav__icon"><img id="navHomeImg" src="casa.png" alt=""></span>
      <span class="nav__text" id="navBrand"></span>
    </button>

    <div class="nav__spacer"></div>

    <button class="nav__item" id="navCalc">
      <span class="nav__icon"><img id="navCalcImg" src="calculatorlogo.png" alt=""></span>
      <span class="nav__text" id="navCalcText"></span>
    </button>
    <button class="nav__item" id="navMap">
      <span class="nav__icon"><img id="navMapImg" src="maplogo.png" alt=""></span>
      <span class="nav__text" id="navMapText"></span>
    </button>
    <button class="nav__item" id="navCredits">
      <span class="nav__icon"><img id="navCreditsImg" src="monsters.png" alt=""></span>
      <span class="nav__text" id="navCreditsText"></span>
    </button>
  </nav>

  <main>

    <!-- ========== PANTALLA 1: MENU PRINCIPAL ========== -->
    <section id="screenMenu" class="screen visible">
      <header>
        <div class="header__container">
          <div class="header__main">
            <h1 id="menuTitle"></h1>
            <div class="header__subtitle" id="menuSubtitle"></div>

            <!-- Selector de idioma (solo aqui) -->
            <div class="lang-row">
              <select id="lang">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="pt">Português</option>
              </select>
            </div>
          </div>

          <div class="header__side">
            <div class="header__menu">
              <button id="menuCalc" class="menu-button">
                <span class="icon"><img src="calculatorlogo.png" alt=""></span>
                <span id="menuCalcText"></span>
              </button>
              <button id="menuMap" class="menu-button">
                <span class="icon"><img src="maplogo.png" alt=""></span>
                <span id="menuMapText"></span>
              </button>
              <button id="menuCredits" class="menu-button">
                <span class="icon"><img src="monsters.png" alt=""></span>
                <span id="menuCreditsText"></span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <div class="article">
        <div class="box">
          <h3 id="aboutTitle"></h3>
          <p id="aboutText"></p>
        </div>
      </div>
    </section>

    <!-- ========== PANTALLA 2: CALCULADORA ========== -->
    <section id="screenCalc" class="screen">
      <button id="backCalc" class="back">&larr;</button>

      <h1 id="title"></h1>

      <!-- Pestañas -->
      <div class="tabs">
        <button id="tab1"></button>
        <button id="tab2"></button>
        <button id="tab3"></button>
      </div>

      <!-- Entrada de numero -->
      <div class="box">
        <label id="label" for="input"></label>
        <input id="input" type="number" value="150" min="1">
        <div class="error" id="error"></div>
      </div>

      <!-- Resultados -->
      <div class="box">
        <h2 id="resultTitle"></h2>
        <div id="results"></div>
      </div>
    </section>

    <!-- ========== PANTALLA 3: GAME MAP ========== -->
    <section id="screenMap" class="screen">
      <button id="backMap" class="back">&larr;</button>

      <h1 id="mapTitle"></h1>

      <div class="box">
        <div class="soon" id="soon"></div>
      </div>
    </section>


    <!-- ========== PANTALLA 4: CREDITOS ========== -->
    <section id="screenCredits" class="screen">
      <button id="backCredits" class="back">&larr;</button>

      <h1 id="creditsTitle"></h1>

      <div class="box">
        <p class="credit-role" id="creditsRole"></p>
        <p class="credit-name">Ghhnu</p>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 Fantasy Browser Kingdom &middot; Made by ghhnu
  </footer>

  </div><!-- fin de #site -->

  <script>
    // ---------- PANTALLA DE CARGA ----------
    var loadStart = Date.now();
    var MIN_LOADING_TIME = 1000; // la pantalla de carga se ve al menos 1 segundo

    var loadingDone = false;

    function hideLoading() {
      if (loadingDone) return;
      loadingDone = true;

      var wait = Math.max(0, MIN_LOADING_TIME - (Date.now() - loadStart));
      setTimeout(function () {
        // 1) Se quita la pantalla de carga (tarda 0.4 s en desvanecerse)
        document.getElementById("loading").className = "hidden";

        // 2) El logo se queda 1 segundo sobre la web difuminada
        setTimeout(playIntro, 400 + 1000);
      }, wait);
    }

    // 3) Animacion final: el logo desaparece y la web se enfoca
    function playIntro() {
      document.getElementById("intro").className = "leave";
      document.getElementById("site").className = "";

      setTimeout(function () {
        document.getElementById("intro").style.display = "none";
        document.getElementById("site").style.filter = "none";
      }, 900);
    }

    // Se oculta cuando la web termina de cargar (imagenes, fuentes, etc.)
    window.addEventListener("load", hideLoading);

    // Por seguridad, se oculta igualmente tras 10 segundos
    setTimeout(hideLoading, 10000);

    // ---------- DATOS Y FORMULAS ----------
    var MAX_LEVEL = 1500;
    var MAX_SKILL = 1000;

    // XP total necesaria para un nivel
    function xpLevel(n) {
      if (n <= 1) return 0;
      return Math.floor(Math.pow(n, 3 + n / 1000));
    }

    // XP total necesaria para una habilidad
    function xpSkill(n) {
      if (n <= 1) return 0;
      return Math.floor(Math.pow(1.5 * n, 2 + n / 1000));
    }

    // Dado un XP total, busca el nivel mas alto que se alcanza
    function findLevel(xp, max, xpFunction) {
      var low = 1;
      var high = max;
      while (low < high) {
        var mid = Math.floor((low + high + 1) / 2);
        if (xpFunction(mid) <= xp) {
          low = mid;
        } else {
          high = mid - 1;
        }
      }
      return low;
    }

    // Velocidad base segun el nivel
    function baseSpeed(level) {
      return level - 1 + 110;
    }

    // Tiempo que tarda cada paso (suelo 150)
    function stepTime(speed) {
      var t = 1;
      if (speed > -261.29) {
        t = Math.max(1, Math.floor(857.36 * Math.log(speed + 261.29) - 4795.01 + 0.5));
      }
      return 50 * Math.ceil(Math.floor(1000 * 150 / t) / 50) / 1000;
    }

    // ---------- TEXTOS EN CADA IDIOMA ----------
    var texts = {
      en: {
        locale: "en-US",
        siteTitle: "Fantasy Browser Kingdom",
        navBrand: "Home",
        subtitle: "Tools and information for the game, all in one place.",
        menuCalc: "Calculator",
        menuMap: "Game Map",
        aboutTitle: "About",
        aboutText: "Welcome to Fantasy Browser Kingdom. Pick an option above to get started.",
        loading: "Loading...",
        soon: "Soon...",
        creditsTitle: "Credits",
        creditsRole: "Creator of the Fantasy Browser Kingdom website",
        title: "Level calculator",
        tabs: ["Level", "Skill", "XP → Level"],
        labels: ["Level (1 - 1500)", "Skill level (1 - 1000)", "Total XP"],
        resultTitles: ["Level info", "Skill info", "Result"],
        invalid: "Enter a valid whole number.",
        maxLevelError: "The maximum level is 1500.",
        maxSkillError: "The maximum skill is 1000.",
        max: "Max",
        totalXp: "Total XP required",
        fromPrevLevel: "XP from previous level",
        toNextLevel: "XP to next level",
        nextTotal: "Total XP of next level",
        exponent: "Exponent",
        speed: "Base speed",
        stepTime: "Time per step",
        stepsPerSecond: "Steps per second",
        fromPrevSkill: "XP from previous skill",
        toNextSkill: "XP to next skill",
        levelReached: "Level reached",
        levelLeft: "XP left to next level",
        skillReached: "Skill reached",
        skillLeft: "XP left to next skill"
      },
      es: {
        locale: "es-ES",
        siteTitle: "Fantasy Browser Kingdom",
        navBrand: "Inicio",
        subtitle: "Herramientas e información del juego, todo en un solo lugar.",
        menuCalc: "Calculadora",
        menuMap: "Mapa del juego",
        aboutTitle: "Acerca de",
        aboutText: "Bienvenido a Fantasy Browser Kingdom. Elige una opción de arriba para empezar.",
        loading: "Cargando...",
        soon: "Pronto...",
        creditsTitle: "Créditos",
        creditsRole: "Creador del sitio web de Fantasy Browser Kingdom",
        title: "Calculadora de nivel",
        tabs: ["Nivel", "Habilidad", "XP → Nivel"],
        labels: ["Nivel (1 - 1500)", "Nivel de habilidad (1 - 1000)", "XP total"],
        resultTitles: ["Información del nivel", "Información de la habilidad", "Resultado"],
        invalid: "Introduce un número entero válido.",
        maxLevelError: "El nivel máximo es 1500.",
        maxSkillError: "La habilidad máxima es 1000.",
        max: "Máximo",
        totalXp: "XP total necesaria",
        fromPrevLevel: "XP desde el nivel anterior",
        toNextLevel: "XP para el siguiente nivel",
        nextTotal: "XP total del siguiente nivel",
        exponent: "Exponente",
        speed: "Velocidad base",
        stepTime: "Tiempo por paso",
        stepsPerSecond: "Pasos por segundo",
        fromPrevSkill: "XP desde la habilidad anterior",
        toNextSkill: "XP para la siguiente habilidad",
        levelReached: "Nivel alcanzado",
        levelLeft: "XP restante al siguiente nivel",
        skillReached: "Habilidad alcanzada",
        skillLeft: "XP restante a la siguiente habilidad"
      },
      pt: {
        locale: "pt-BR",
        siteTitle: "Fantasy Browser Kingdom",
        navBrand: "Início",
        subtitle: "Ferramentas e informações do jogo, tudo em um só lugar.",
        menuCalc: "Calculadora",
        menuMap: "Mapa do jogo",
        aboutTitle: "Sobre",
        aboutText: "Bem-vindo ao Fantasy Browser Kingdom. Escolha uma opção acima para começar.",
        loading: "Carregando...",
        soon: "Em breve...",
        creditsTitle: "Créditos",
        creditsRole: "Criador do site do Fantasy Browser Kingdom",
        title: "Calculadora de nível",
        tabs: ["Nível", "Habilidade", "XP → Nível"],
        labels: ["Nível (1 - 1500)", "Nível de habilidade (1 - 1000)", "XP total"],
        resultTitles: ["Informações do nível", "Informações da habilidade", "Resultado"],
        invalid: "Digite um número inteiro válido.",
        maxLevelError: "O nível máximo é 1500.",
        maxSkillError: "A habilidade máxima é 1000.",
        max: "Máximo",
        totalXp: "XP total necessário",
        fromPrevLevel: "XP desde o nível anterior",
        toNextLevel: "XP para o próximo nível",
        nextTotal: "XP total do próximo nível",
        exponent: "Expoente",
        speed: "Velocidade base",
        stepTime: "Tempo por passo",
        stepsPerSecond: "Passos por segundo",
        fromPrevSkill: "XP desde a habilidade anterior",
        toNextSkill: "XP para a próxima habilidade",
        levelReached: "Nível alcançado",
        levelLeft: "XP restante para o próximo nível",
        skillReached: "Habilidade alcançada",
        skillLeft: "XP restante para a próxima habilidade"
      }
    };

    // ---------- ESTADO ----------
    var language = "en";      // idioma por defecto
    var mode = 1;             // 1 = Nivel, 2 = Habilidad, 3 = XP → Nivel
    var currentScreen = "screenMenu";

    // ---------- AYUDAS ----------
    function t(key) {
      return texts[language][key];
    }

    function el(id) {
      return document.getElementById(id);
    }

    // Formatea un numero con separadores de miles
    function format(n) {
      return n.toLocaleString(texts[language].locale);
    }

    // Formatea un numero con decimales fijos
    function decimals(n, d) {
      return n.toLocaleString(texts[language].locale, {
        minimumFractionDigits: d,
        maximumFractionDigits: d
      });
    }

    // Crea las lineas de resultado a partir de una lista [nombre, valor]
    function makeRows(list) {
      var html = "";
      for (var i = 0; i < list.length; i++) {
        html += '<div class="row"><span>' + list[i][0] + "</span><span>" + list[i][1] + "</span></div>";
      }
      return html;
    }

    // ---------- CAMBIAR DE PANTALLA ----------
    // Marca en la barra la opcion que esta abierta
    function markNav(id) {
      el("navHome").className = "nav__item nav__brand" + (id === "screenMenu" ? " active" : "");
      el("navCalc").className = "nav__item" + (id === "screenCalc" ? " active" : "");
      el("navMap").className = "nav__item" + (id === "screenMap" ? " active" : "");
      el("navCredits").className = "nav__item" + (id === "screenCredits" ? " active" : "");
    }

    // Cambio de pantalla con animacion y difuminado
    var switchTimer = null;

    function showScreen(id, instant) {
      var main = document.querySelector("main");
      clearTimeout(switchTimer);

      // Sin animacion (solo al arrancar la web)
      if (instant) {
        currentScreen = id;
        markNav(id);
        applyScreen(id);
        main.className = "";
        return;
      }

      // Si ya estamos en esa pantalla, no hace falta cambiar nada
      if (id === currentScreen) {
        main.className = "";
        return;
      }

      currentScreen = id;
      markNav(id);

      // 1) El contenido actual se difumina y desaparece
      main.className = "switching";

      // 2) Cuando termina, se cambia la pantalla y el nuevo contenido aparece enfocandose
      switchTimer = setTimeout(function () {
        applyScreen(id);
        main.className = "";
      }, 300);
    }

    // Muestra de golpe la pantalla indicada
    function applyScreen(id) {

      var screens = document.querySelectorAll(".screen");
      for (var i = 0; i < screens.length; i++) {
        screens[i].className = "screen";
      }
      el(id).className = "screen visible";

      window.scrollTo(0, 0);
    }

    // ---------- PINTAR TEXTOS ----------
    function updateTexts() {
      document.documentElement.lang = language;
      document.title = t("siteTitle");

      // Barra de navegacion
      el("navBrand").textContent = t("navBrand");
      el("navCalcText").textContent = t("menuCalc");
      el("navMapText").textContent = t("menuMap");
      el("navHome").title = t("navBrand");
      el("navCalc").title = t("menuCalc");
      el("navMap").title = t("menuMap");

      // Menu
      el("menuTitle").textContent = t("siteTitle");
      el("menuSubtitle").textContent = t("subtitle");
      el("menuCalcText").textContent = t("menuCalc");
      el("menuMapText").textContent = t("menuMap");
      el("aboutTitle").textContent = t("aboutTitle");
      el("aboutText").textContent = t("aboutText");

      // Textos alternativos de las imagenes (tambien en su idioma)
      el("navHomeImg").alt = t("navBrand");
      el("navCalcImg").alt = t("menuCalc");
      el("navMapImg").alt = t("menuMap");
      el("introLogo").alt = t("siteTitle");
      el("loadingImg").alt = t("loading");
      el("loadingText").textContent = t("loading");

      // Game Map
      el("mapTitle").textContent = t("menuMap");
      el("soon").textContent = t("soon");

      // Creditos
      el("navCreditsText").textContent = t("creditsTitle");
      el("menuCreditsText").textContent = t("creditsTitle");
      el("navCredits").title = t("creditsTitle");
      el("navCreditsImg").alt = t("creditsTitle");
      el("creditsTitle").textContent = t("creditsTitle");
      el("creditsRole").textContent = t("creditsRole");

      // Calculadora
      el("title").textContent = t("title");

      for (var i = 1; i <= 3; i++) {
        el("tab" + i).textContent = t("tabs")[i - 1];
        el("tab" + i).className = (i === mode) ? "active" : "";
      }

      el("label").textContent = t("labels")[mode - 1];
      el("resultTitle").textContent = t("resultTitles")[mode - 1];
    }

    // ---------- CALCULAR Y MOSTRAR ----------
    function calculate() {
      var value = Number(el("input").value);
      var results = el("results");
      el("error").textContent = "";
      results.innerHTML = "";

      // Comprobar que sea un entero valido
      if (!Number.isInteger(value) || value < 1) {
        el("error").textContent = t("invalid");
        return;
      }

      if (mode === 1) {
        // ----- NIVEL -----
        if (value > MAX_LEVEL) {
          el("error").textContent = t("maxLevelError");
          return;
        }

        var xp = xpLevel(value);
        var prev = xpLevel(value - 1);
        var next = (value < MAX_LEVEL) ? xpLevel(value + 1) : null;
        var speed = baseSpeed(value);
        var step = stepTime(speed);

        results.innerHTML = makeRows([
          [t("totalXp"), format(xp)],
          [t("fromPrevLevel"), value > 1 ? format(xp - prev) : "-"],
          [t("toNextLevel"), next !== null ? format(next - xp) : t("max")],
          [t("nextTotal"), next !== null ? format(next) : "-"],
          [t("exponent"), decimals(3 + value / 1000, 3)],
          [t("speed"), format(speed)],
          [t("stepTime"), decimals(step, 2) + " s"],
          [t("stepsPerSecond"), decimals(1 / step, 2)]
        ]);

      } else if (mode === 2) {
        // ----- HABILIDAD -----
        if (value > MAX_SKILL) {
          el("error").textContent = t("maxSkillError");
          return;
        }

        var xp2 = xpSkill(value);
        var prev2 = xpSkill(value - 1);
        var next2 = (value < MAX_SKILL) ? xpSkill(value + 1) : null;

        results.innerHTML = makeRows([
          [t("totalXp"), format(xp2)],
          [t("fromPrevSkill"), value > 1 ? format(xp2 - prev2) : "-"],
          [t("toNextSkill"), next2 !== null ? format(next2 - xp2) : t("max")],
          [t("exponent"), decimals(2 + value / 1000, 3)]
        ]);

      } else {
        // ----- XP → NIVEL -----
        var level = findLevel(value, MAX_LEVEL, xpLevel);
        var skill = findLevel(value, MAX_SKILL, xpSkill);

        results.innerHTML = makeRows([
          [t("levelReached"), format(level)],
          [t("levelLeft"), level < MAX_LEVEL ? format(xpLevel(level + 1) - value) : "-"],
          [t("skillReached"), format(skill)],
          [t("skillLeft"), skill < MAX_SKILL ? format(xpSkill(skill + 1) - value) : "-"]
        ]);
      }
    }

    // ---------- EVENTOS ----------
    function setMode(newMode) {
      mode = newMode;
      var defaults = [0, 150, 100, 7156280]; // valor inicial de cada pestaña
      el("input").value = defaults[newMode];
      updateTexts();

      // Los resultados aparecen en cascada (solo al cambiar de pestaña)
      el("results").className = "animate";
      calculate();
      setTimeout(function () { el("results").className = ""; }, 900);
    }

    // Botones grandes del menu
    el("menuCalc").onclick = function () { showScreen("screenCalc"); };
    el("menuMap").onclick = function () { showScreen("screenMap"); };
    el("menuCredits").onclick = function () { showScreen("screenCredits"); };

    // Botones de la barra de navegacion
    el("navHome").onclick = function () { showScreen("screenMenu"); };
    el("navCalc").onclick = function () { showScreen("screenCalc"); };
    el("navMap").onclick = function () { showScreen("screenMap"); };
    el("navCredits").onclick = function () { showScreen("screenCredits"); };

    // Flechas para volver al menu
    el("backCalc").onclick = function () { showScreen("screenMenu"); };
    el("backMap").onclick = function () { showScreen("screenMenu"); };
    el("backCredits").onclick = function () { showScreen("screenMenu"); };


    // Pestañas de la calculadora
    el("tab1").onclick = function () { setMode(1); };
    el("tab2").onclick = function () { setMode(2); };
    el("tab3").onclick = function () { setMode(3); };

    // Cambio de idioma
    el("lang").onchange = function () {
      var main = document.querySelector("main");
      var newLanguage = el("lang").value;

      // El contenido se difumina, cambian los textos y vuelve a enfocarse
      main.className = "switching";
      setTimeout(function () {
        language = newLanguage;
        updateTexts();
        calculate();
        main.className = "";
      }, 250);
    };

    // Onda al hacer clic en los botones grandes, pestañas y flechas
    document.addEventListener("pointerdown", function (e) {
      var button = e.target.closest ? e.target.closest(".menu-button, .tabs button, .back") : null;
      if (!button) return;

      var rect = button.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height) * 2;
      var wave = document.createElement("span");
      wave.className = "ripple";
      wave.style.width = size + "px";
      wave.style.height = size + "px";
      wave.style.left = (e.clientX - rect.left - size / 2) + "px";
      wave.style.top = (e.clientY - rect.top - size / 2) + "px";
      button.appendChild(wave);
      setTimeout(function () { wave.remove(); }, 650);
    });

    // Particulas de fondo (tamaño, posicion y velocidad aleatorios)
    (function makeParticles() {
      var box = el("particles");
      for (var i = 0; i < 14; i++) {
        var p = document.createElement("span");
        var size = 4 + Math.floor(Math.random() * 6);
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (14 + Math.random() * 16) + "s";
        p.style.animationDelay = (-Math.random() * 30) + "s";
        box.appendChild(p);
      }
    })();

    el("input").addEventListener("input", calculate);

    // Arrancar la pagina
    updateTexts();
    calculate();
    showScreen("screenMenu", true);
  </script>
